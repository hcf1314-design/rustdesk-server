name: build-kx

on:
  workflow_dispatch:

jobs:
  build:
    name: Build musl amd64 (kx)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install musl toolchain and build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools pkg-config perl make libssl-dev

      - name: Install rust target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-unknown-linux-musl

      - name: Compat patch for newer hbb_common
        # hbb_common >= kx-v2(229b9045) 删掉了 `pub use protos::message as message_proto;` 别名，
        # 而 rustdesk-server master 仍按旧别名引用。全仓仅 rendezvous_server.rs 一处。
        run: |
          grep -rn "hbb_common::message_proto" src/ || true
          sed -i 's|hbb_common::message_proto|hbb_common::protos::message|g' src/rendezvous_server.rs
          grep -rn "hbb_common::message_proto" src/ && echo "!! 仍有残留" || echo "OK 已全部替换"

      - name: Build
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          OPENSSL_STATIC: '1'
        run: |
          cargo build --release --target x86_64-unknown-linux-musl

      - name: Chmod
        run: chmod -v a+x target/x86_64-unknown-linux-musl/release/hbbs target/x86_64-unknown-linux-musl/release/hbbr target/x86_64-unknown-linux-musl/release/rustdesk-utils

      - name: Publish Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-linux-amd64
          path: |
            target/x86_64-unknown-linux-musl/release/hbbr
            target/x86_64-unknown-linux-musl/release/hbbs
            target/x86_64-unknown-linux-musl/release/rustdesk-utils
          if-no-files-found: error
